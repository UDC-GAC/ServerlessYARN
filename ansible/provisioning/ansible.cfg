[defaults]
pipelining = True
host_key_checking = False
deprecation_warnings = False
interpreter_python = /usr/bin/python3
callbacks_enabled = profile_tasks, timer
# Number of ansible hosts that can be managed in parallel
forks = 5
stdout_callback = yaml
collections_path = ~/.ansible/collections:/usr/share/ansible/collections:./collections
# Ansible facts cache
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ${HOME}/.ansible_fact_cache
fact_caching_timeout = 86400
[ssh_connection]
pipelining = True
ssh_args = -o PreferredAuthentications=publickey -o ControlMaster=auto -o ControlPersist=600s
control_path = ~/.ansible/cp/socket-%%h