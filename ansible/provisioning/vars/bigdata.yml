## Big Data (Hadoop / Spark / HDFS) specific variables
## Loaded only by the plays that use them, along with vars/main.yml (see 'bigdata_vars' in playbooks/paths.yml)

## App types
## Apps deployed as a Hadoop cluster (HDFS + YARN), i.e., with a master container and worker containers
bigdata_app_types: [hadoop_app, spark_app]

## Container images of Big Data apps (merged with the generic ones on 'app_mapping', see start_containers_playbook.yml)
## Definition files are relative to the templates directory
bigdata_app_mapping:
  hadoop_app:
    definition_file: bigdata/images/hadoop_app.def
    image: hadoop_app.sif
    install_extra_files: base/hadoop_app
    image_dependency: base
  spark_app:
    definition_file: bigdata/images/spark_app.def
    image: spark_app.sif
    image_dependency: hadoop_app
  hdfs_frontend:
    definition_file: bigdata/images/hdfs_frontend.def
    image: hdfs_frontend.sif
    image_dependency: hadoop_app

## Global HDFS
global_hdfs_app_name: global_hdfs
hdfs_frontend_container_name: hdfs-frontend
data_locality_registry_file: "{{ installation_path }}/data_locality_registry.json" # registry of app deployments used by the 'Data-locality' allocation policy

## Framework versions
hadoop_version: 3.4.2
spark_version: 3.4.3
zookeeper_version: 3.9.4 # used for global HDFS rbf mode
