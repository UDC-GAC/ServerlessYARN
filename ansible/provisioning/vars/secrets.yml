## Default secrets
##
## WARNING: these values are INSECURE and publicly known. They are only meant for
## development and testing environments (e.g., the Vagrant virtual cluster).
##
## This file is the single source of truth for every secret used by the platform.
## Do NOT edit it to set production secrets. Instead, create the git-ignored file
## 'config/secrets.yml' (ideally encrypted with Ansible Vault) and redefine there
## any of the variables below. Values defined in 'config/secrets.yml' take precedence
## over the ones defined here. See the "Secrets" section of the README for details.

## CouchDB
## Note: the Debian CouchDB package always names the admin user 'admin', only its password can be set
couchdb_admin_pass: 'admin'
## Erlang cookie used by CouchDB nodes to authenticate each other
couchdb_cookie: 'abcd'

## Django (web interface)
