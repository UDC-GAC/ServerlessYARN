## Setup a Hadoop cluster (HDFS + YARN, optionally Spark) on the app containers and start its services
## Tags: setup_hadoop, setup_hdfs

- name: Setup hadoop on containers
  block:
    - name: Workers file setup
      tags: setup_hadoop, setup_hdfs
      block:
        - name: Copy app files already on containers & Update workers file on containers
          shell: "
            {% for item in containers_info %}
              {% if item.host == inventory_hostname %}
                sudo {{ singularity_command_alias }} exec instance://{{ item.container_name }} su - {{ user_info.user_name }} -c '\ 
                  cp -pr /opt/hadoop_files {{ bind_dir_on_container }}/ && 
                  {% for item in worker_list %}
                    echo {{ item }} >> $HADOOP_CONF_DIR/workers && 
                  {% endfor %}true
                ' && 
              {% endif  %}
            {% endfor %}true"
          args:
            executable: /bin/bash
          vars:
            worker_list: "{{ containers_info | 
                    map(attribute='container_name') |
                    reject('equalto', master_container) | list}}"

    - name: Prepare and copy all config files to containers
      tags: setup_hadoop, setup_hdfs
      block:
        - name: Setup configuration files to transfer
          delegate_to: localhost
          run_once: yes
          block:
            - name: Create temporary directory to store templated config files
              file:
                path: "{{ app_tmpdir }}"
                state: directory

            - name: Set file list to transfer
              vars:
                start_hdfs: yes
                start_rbf: "{{ global_hdfs and hdfs_mode == 'rbf' }}"
                setup_spark: "{{ app_type is defined and app_type == 'spark_app' and 'setup_hdfs' not in ansible_run_tags }}"
                setup_yarn: "{{ (not global_hdfs or app_name != global_hdfs_app_name or hdfs_mode in ['isolated', 'rbf']) and 'setup_hdfs' not in ansible_run_tags }}" ## RBF requires yarn-site.xml for zookeeper conf
              set_fact:
                transfer_file_dict:
                  - {
                      # remove hdfs-rbf-site if not using RBF
                      file_list: "{{ hdfs_file_list if start_rbf else hdfs_file_list | difference(['hdfs-rbf-site.xml']) }}",
                      destination: "\"$HADOOP_CONF_DIR\"",
                      template_dir: "bigdata/hadoop",
                      condition: "{{ start_hdfs }}"
                    }
                  - {
                      file_list: "{{ hadoop_file_list + (['core-site.xml'] if not start_hdfs else []) }}",
                      destination: "\"$HADOOP_CONF_DIR\"",
                      template_dir: "bigdata/hadoop",
                      condition: "{{ setup_yarn }}"
                    }
                  - {
                      file_list: "{{ shellprofile_file_list }}",
                      destination: "\"$HADOOP_CONF_DIR\"/shellprofile.d",
                      template_dir: "bigdata/hadoop/shellprofile.d",
                      condition: "{{ start_hdfs }}"
                    }
                  - {
                      file_list: "{{ spark_file_list }}",
                      destination: "\"$SPARK_CONF_DIR\"",
                      template_dir: "bigdata/spark",
                      condition: "{{ setup_spark }}"
                    }

            - name: Copy config files to master
              when: item.0.condition | default(true)
              template:
                src: "{{ templates_dir }}/{{ item.0.template_dir }}/{{ item.1 }}"
                dest: "{{ app_tmpdir }}/{{ item.1 }}"
                mode: preserve
              loop: "{{ transfer_file_dict | subelements('file_list') }}"

        - name: Copy config files to hosts
          synchronize:
            src: "{{ app_tmpdir }}/"
            dest: "{{ app_tmpdir }}/"

        - name: Copy and update config files to containers
          shell: |
            {% for item in containers_info -%}
              {% if item.host == inventory_hostname -%}
                {% set container_bind_dir = item.disk_path if item.disk_path is defined else [bind_dir, item.container_name] | join('/') -%}
                {% for file_set in transfer_file_dict -%}
                  {% if file_set.condition | default (true) -%}
                    {% for file in file_set.file_list -%}
                      cp {{ app_tmpdir }}/{{ file }} {{ container_bind_dir }}/{{ file }} && \
                    {% endfor -%}
                  {% endif -%}
                {% endfor -%}
                sudo {{ singularity_command_alias }} exec instance://{{ item.container_name }} su - {{ user_info.user_name }} -c \
                '{% for file_set in transfer_file_dict -%}
                  {% if file_set.condition | default (true) -%}
                    {% for file in file_set.file_list -%}
                      cp {{ bind_dir_on_container }}/{{ file }} {{ file_set.destination }}/{{ file }} && \
                    {% endfor -%}
                  {% endif -%}
                {% endfor -%}true' && \
              {% endif -%}
            {% endfor -%}true
          args:
            executable: /bin/bash

        - block:
          - name: Remove temporary directory in server
            file:
              path: "{{ app_tmpdir }}"
              state: absent
            delegate_to: localhost
            run_once: yes
          - name: Remove temporary directory in hosts
            file:
              path: "{{ app_tmpdir }}"
              state: absent
          tags: setup_hdfs

    - name: Setup SSH connection
      tags: setup_hadoop, setup_hdfs
      block:
        - name: Update ssh known_hosts on master container & Move master container ssh public key
          when: inventory_hostname == master_host
          shell: "sudo {{ singularity_command_alias }} exec instance://{{ master_container }} su - {{ user_info.user_name }} -c \
            'ssh-keyscan -t rsa `hostname` >> ~/.ssh/known_hosts \
            && ssh-keyscan -t rsa -f $HADOOP_CONF_DIR/workers >> ~/.ssh/known_hosts \
            && cp ~/.ssh/id_rsa.pub {{ bind_dir_on_container }}/{{ master_container }}.pub'"
          args:
            executable: /bin/bash

        - name: Prepare master container bind path variable
          when: "item.container_name == master_container"
          set_fact:
            master_container_bind_path: "{{ item.disk_path if item.disk_path is defined else [bind_dir, item.container_name] | join('/') }}"
          with_items:
          - "{{ containers_info }}"

        - name: Create temporary app directory on hosts for ssh public key
          file:
            path: "{{ app_ssh_keys_dir }}/{{ app_name }}/"
            state: directory

        - name: Copy master container ssh public key to hosts
          delegate_to: "{{ master_host }}" # this will push from master_host to each host, i.e., a remote host to remote host copy
          vars:
            ansible_ssh_extra_args: "" ## required to avoid failure; synchronize and delegating to hosts other than 'localhost' introduce unexpected interactions
          synchronize:
            src: "{{ master_container_bind_path }}/{{ master_container }}.pub"
            dest: "{{ app_ssh_keys_dir }}/{{ app_name }}/{{ master_container }}.pub"

        - name: Copy and append master container ssh public key to the other containers
          shell: "{% for item in containers_info %}
            {% if item.host == inventory_hostname and item.container_name != master_container %}
            {% set container_bind_dir = item.disk_path if item.disk_path is defined else [bind_dir, item.container_name] | join('/') %}
            cp {{ app_ssh_keys_dir }}/{{ app_name }}/{{ master_container }}.pub {{ container_bind_dir }}/{{ master_container }}.pub && \
            sudo {{ singularity_command_alias }} exec instance://{{ item.container_name }} su - {{ user_info.user_name }} -c \
            'cat {{ bind_dir_on_container }}/{{ master_container }}.pub >> ~/.ssh/authorized_keys \
            && rm {{ bind_dir_on_container }}/{{ master_container }}.pub' && 
            {% endif  %}
            {% endfor %}true"
          args:
            executable: /bin/bash

    - name: Start Hadoop services
      vars:
        start_hdfs: "{{ not global_hdfs or hdfs_mode != 'single' or app_name == global_hdfs_app_name }}"
        start_yarn: "{{ (not global_hdfs or app_name != global_hdfs_app_name or hdfs_mode == 'isolated') and 'setup_hdfs' not in ansible_run_tags }}"
      block:
        - name: Start HDFS + YARN
          tags: setup_hadoop, setup_hdfs
          block:
            - name: Format filesystem, start HDFS and YARN (Master)
              when: inventory_hostname == master_host
              shell: "sudo {{ singularity_command_alias }} exec instance://{{ master_container }} su - {{ user_info.user_name }} -c \
                ' \
                {% if start_hdfs %}
                  cd $HADOOP_HOME && bash format_filesystem.sh && \ 
                  $HADOOP_HOME/bin/hdfs --daemon start namenode && \ 
                  {% if global_hdfs and hdfs_mode == 'rbf' %}
                    $HADOOP_HOME/bin/hdfs --daemon start dfsrouter && \ 
                  {% endif %}
                {% endif %}
                {% if start_yarn %}
                  $HADOOP_HOME/bin/yarn --daemon start resourcemanager && \ 
                {% endif %}
                'true"
              args:
                executable: /bin/bash
              async: 10800
              poll: 0
              register: start_master_services

            - name: Start HDFS and YARN (Worker)
              shell: "{% for item in containers_info %}
                {% if item.host == inventory_hostname and item.container_name != master_container %}
                  sudo {{ singularity_command_alias }} exec instance://{{ item.container_name }} su - {{ user_info.user_name }} -c \
                  ' \
                  {% if start_hdfs %}
                    $HADOOP_HOME/bin/hdfs --daemon start datanode && \ 
                  {% endif %}
                  {% if start_yarn %}
                    $HADOOP_HOME/bin/yarn --daemon start nodemanager && \
                  {% endif %}
                  true' &&
                {% endif %}
                {% endfor %}true"
              args:
                executable: /bin/bash
              async: 10800
              poll: 0
              register: start_worker_services

            - name: Wait for master services to start
              async_status:
                jid: "{{ start_master_services.ansible_job_id }}"
              when: inventory_hostname == master_host
              register: master_job_result
              until: master_job_result.finished
              retries: 120
              delay: 0.5

            - name: Wait for worker services to start
              async_status:
                jid: "{{ start_worker_services.ansible_job_id }}"
              register: worker_job_result
              until: worker_job_result.finished
              retries: 120
              delay: 0.5
              when: start_worker_services.ansible_job_id is defined
  vars:
    - hdfs_file_list: ["core-site.xml", "hdfs-site.xml", "hadoop-env.sh", "rack_topology.py", "hdfs-rbf-site.xml"]
    - hadoop_file_list: ["yarn-site.xml", "mapred-site.xml", "yarn-env.sh", "capacity-scheduler.xml"]
    - shellprofile_file_list: ["tools.sh"]
    - spark_file_list: ["spark-defaults.conf"]
    - containers_info: "{{ containers_info_str | replace('\n','') | replace(' ','') }}"
    - global_datanodes_info: "{{ datanodes_info_str | replace('\n','') | replace(' ','') }}"
  tags: never
