
- name: Benchmark disk
  when: not create_lvm or measure_host_list_str is undefined or measure_host_list[inventory_hostname]
  vars:
    measure_host_list: "{{ measure_host_list_str | replace('\n','') | replace(' ','') if measure_host_list_str is defined else [] }}"
  block:
    - name: Check for previous fio installation
      shell: "which $HOME/.local/bin/fio"
      register: result
      failed_when: false

    - name: Install Fio
      when: result is failed
      block:
        - name: Install prerequisites for FIO
          when: virtual_mode
          apt:
            name:
            - libaio-dev
            state: latest
            update_cache: yes

        - name: Clone Fio repo
          git:
            repo: https://github.com/axboe/fio.git
            dest: "{{ installation_path }}/fio"

        - name: Configure Fio
          shell: ./configure --prefix=$HOME/.local/
          args:
            chdir: "{{ installation_path }}/fio"
            executable: /bin/bash

        - name: Build Fio
          make:
            chdir: "{{ installation_path }}/fio"

        - name: Install Fio
          make:
            chdir: "{{ installation_path }}/fio"
            target: install

    - name: Measure disk bandwidth
      block:

      ## Get random string to always guarantee creation of a new file
      - name: Generate random code
        set_fact:
          random_code: "{{ lookup('community.general.random_string', special=false) }}"

      - name: Fio benchmarks
        become: no
        vars:
          tmp_file: "test_{{ inventory_hostname }}.img"
          new_disks_dict: "{{ new_disks_dict_str | replace(' ','') if new_disks_dict_str is defined else ''}}"
          host_disks: "{{ (new_disks_dict[inventory_hostname] if new_disks_dict != '' else hostvars[inventory_hostname].disks) | dict2items }}"
          direct: 1
          runtime: 60s
          benchmarks:
            - { inventory_label: read_bw,         size: 10m,  block_size: 1M, mode: read }      # seq  read
            - { inventory_label: write_bw,        size: 500m, block_size: 1M, mode: write }     # seq  write
            # TODO: add support for random BW in ServerlessContainers
            # - { inventory_label: random_read_bw,  size: 10m,  block_size: 4k, mode: randread }  # rand read
            # - { inventory_label: random_write_bw, size: 500m, block_size: 4k, mode: randwrite } # rand write

        block:

        - name: Evaluate if any benchmark is actually required
          when: prompt_disk_benchmark
          block:
          - name: Evaluate if any benchmark is actually required on each host
            set_fact:
              any_missing_bench: >-
                {%- set ns = namespace(missing_bench=false) -%}
                {%- for item0 in host_disks -%}
                  {%- for item1 in benchmarks -%}
                    {%- if (not create_lvm or item0.key == 'lvm') and item1.inventory_label not in item0.value -%}
                      {%- set ns.missing_bench = true -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{- ns.missing_bench -}}

          - name: Consolidate checks across all hosts into a single boolean
            delegate_to: localhost
            run_once: true
            set_fact:
              trigger_prompt: >-
                {{
                  (ansible_play_hosts | map('extract', hostvars, 'any_missing_bench') | map('bool')) is any
                }}

        - name: Benchmark user confirmation if required
          when: prompt_disk_benchmark and trigger_prompt
          delegate_to: localhost
          run_once: yes
          block:
          - name: Prompt user for confirmation
            pause:
              prompt: |
                *****************************************************************
                *                                                               *
                *               ATTENTION: CRITICAL ACTION                      *
                *                                                               *
                *   Disk benchmark(s) need to be run to estimate performance.   *
                *                                                               *
                *****************************************************************
                Do you want to proceed? [Y/n]
            register: user_input

          - name: Set confirmation boolean
            set_fact:
              disk_benchmark_confirmation: >-
                {{
                  (user_input.user_input | default('', true) | trim | lower) in ['y', 'yes', 'true', '']
                }}

          - name: Trigger failure if user does not allow the disk benchmark to run
            when: not disk_benchmark_confirmation | bool
            fail:
              msg: "At least one disk needs to be benchmarked. Please set bandwidth manually in inventory or allow the benchmark in the next run"

        - name: Run benchmarks
          when: "(not create_lvm or item.0.key == 'lvm') and item.1.inventory_label not in item.0.value" # this last check would avoid re-benchmarking extended LVs
          shell: "$HOME/.local/bin/fio --name TEST --eta-newline=5s \
            --filename={{ item.0.value.path }}/{{ item.1.mode }}_{{ tmp_file }}.{{ random_code }}.{{ item.0.key }} \
            --rw={{ item.1.mode }} --size={{ item.1.size }} --io_size=10g --blocksize={{ item.1.block_size }} --ioengine=libaio \
            --fsync=10000 --iodepth=32 --direct={{ direct }} --numjobs=1 --time_based --runtime={{ runtime }} --group_reporting \
            --output-format=json"
          register: fio_output
          with_nested:
            - "{{ host_disks }}"
            - "{{ benchmarks }}"
          throttle: "{{ '1' if virtual_mode else (groups['nodes'] | length) }}"
          loop_control:
            label: "{{ item.0.key }} ({{ item.0.value.path }}): {{ item.1.mode }}"

        - name: Remove tmp files
          when: "(not create_lvm or item.0.key == 'lvm') and item.1.inventory_label not in item.0.value"
          file:
            path: "{{ item.0.value.path }}/{{ item.1.mode }}_{{ tmp_file }}.{{ random_code }}.{{ item.0.key }}"
            state: absent
          with_nested:
            - "{{ host_disks }}"
            - "{{ benchmarks }}"
          loop_control:
            label: "{{ item.0.value.path }}/{{ item.1.mode }}_{{ tmp_file }}.{{ random_code }}.{{ item.0.key }}"

        - name: Update host information in inventory (with fio)
          when: seq_read and seq_write
          #when: seq_read and seq_write and rand_read and rand_write
          delegate_to: localhost
          shell: "python3 {{ scripts_dir }}/hosts/update_host_disks_bw_inv.py {{ inventory_hostname }} {{ item.key }} {{ seq_read }} {{ seq_write }} B/s {{ main_config }}"
          #shell: "python3 {{ scripts_dir }}/hosts/update_host_disks_bw_inv.py {{ inventory_hostname }} {{ item.key }} {{ seq_read }} {{ rand_read }} {{ seq_write }} {{ rand_write }} B/s {{ main_config }}"
          vars:
            seq_read:   "{{ (filtered_fio_output[0].stdout | from_json).jobs[0].read.bw_bytes  if 'skipped' not in filtered_fio_output[0] else none }}"
            seq_write:  "{{ (filtered_fio_output[1].stdout | from_json).jobs[0].write.bw_bytes if 'skipped' not in filtered_fio_output[1] else none }}"
            # rand_read:  "{{ (filtered_fio_output[2].stdout | from_json).jobs[0].read.bw_bytes  if 'skipped' not in filtered_fio_output[2] else none }}"
            # rand_write: "{{ (filtered_fio_output[3].stdout | from_json).jobs[0].write.bw_bytes if 'skipped' not in filtered_fio_output[3] else none }}"
            filtered_fio_output: "{{ fio_output.results | selectattr('item', 'defined') | selectattr('item.0.key', 'equalto', item.key) | list }}"
          with_items: "{{ host_disks }}"
          throttle: 1


- name: Estimate disk performance based on optimistic approximation
  when: create_lvm and measure_host_list_str is defined and not measure_host_list[inventory_hostname]
  delegate_to: localhost
  shell: "python3 {{ scripts_dir }}/hosts/update_host_disks_bw_inv.py {{ inventory_hostname }} lvm {{ estimated_new_read_bw }} {{ estimated_new_write_bw }} MB/s {{ main_config }}"
  vars:
    measure_host_list: "{{ measure_host_list_str | replace('\n','') | replace(' ','') }}"
    number_of_new_disks: "{{ (new_disks_list | split(',')) | length }}"
    number_of_current_disks: "{{ (hostvars[inventory_hostname].disks | length) -1 }}"
    number_of_old_disks: "{{ number_of_current_disks|int - number_of_new_disks|int }}"
    estimated_new_read_bw:  "{{ (hostvars[inventory_hostname].disks.lvm.read_bw) * (number_of_current_disks|int / number_of_old_disks|int) }}"
    estimated_new_write_bw: "{{ (hostvars[inventory_hostname].disks.lvm.write_bw) * (number_of_current_disks|int / number_of_old_disks|int) }}"
  throttle: 1
