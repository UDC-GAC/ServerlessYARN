- name: Start couchdb service
  when: "virtual_mode"
  block:
    ## Start CouchDB installed on the host (virtual mode) listening on 'couchdb_port'
    # Only the port option is managed, so other settings CouchDB may write to local.ini at runtime are kept
    - name: Set CouchDB port
      become: true
      community.general.ini_file:
        path: /opt/couchdb/etc/local.ini
        section: chttpd
        option: port
        value: "{{ couchdb_port }}"
        owner: couchdb
        group: couchdb
      register: couchdb_port_config

    - name: Start couchdb service (restart it if its port has changed)
      become: true
      service:
        name: couchdb
        state: "{{ 'restarted' if couchdb_port_config is changed else 'started' }}"

    - name: Wait for CouchDB to listen on its port
      wait_for:
        host: 127.0.0.1
        port: "{{ couchdb_port }}"
        timeout: 60


## This assumes that the container engine in question is already installed in the server node
- name: Start couchdb inside a container
  block:
    - name: Start couchdb inside an apptainer/singularity container
      block:

        - name: Copy CouchDB definition file and configuration files
          template:
            src: "{{ templates_dir }}/services/couchdb/{{ item }}"
            dest: "{{ couchdb_path }}/{{ item }}"
            mode: "{{ '0600' if item == 'debian_couchdb_conf.dat' else omit }}" ## contains the admin password
          with_items:
            - "{{ definition_file }}"
            - debian_couchdb_conf.dat
            - local.ini
            - logrotate-couchdb
            - logrotate-loop.sh

        - name: Build image (couchdb)
          shell: "{{ singularity_command_alias }} build {{ image_file }} {{ definition_file }}"
          args:
            chdir: "{{ couchdb_path }}"
            executable: /bin/bash
            creates: "{{ image_file }}"
            
        - name: Check containers status
          shell: "{{ singularity_command_alias }} instance list -j"
          register: apptainer_list_output
          args:
            executable: /bin/bash

        # Advantage: --writable-tmpfs use an in-memory temporary filesystem (faster reads and writes)
        # Problem: These filesystem has a limited size (64 MiB by default) so it is not recommended for long executions
        #
        # - name: Start couchdb apptainer container
        #   shell: "{{ singularity_command_alias }} instance start -C --writable-tmpfs {{ image_file }} {{ container_name }}"
        #   when: "container_name not in apptainer_list_output.stdout"
        #   args:
        #     chdir: "{{ installation_path }}"
        #     executable: /bin/bash

        # local.ini is bound (instead of only being copied into the image when it is built) so that changes such as the port apply without rebuilding the image
        - name: Start couchdb apptainer container
          shell: "{{ singularity_command_alias }} instance start -C --bind {{ couchdb_path }}/data:/couchdb_data --bind {{ couchdb_path }}/log:/var/log/couchdb --bind {{ couchdb_path }}/local.ini:/opt/couchdb/etc/local.ini {{ image_file }} {{ container_name }}"
          when: "container_name not in apptainer_list_output.stdout"
          args:
            chdir: "{{ couchdb_path }}"
            executable: /bin/bash 

        - name: Wait for CouchDB to listen on its port
          wait_for:
            host: 127.0.0.1
            port: "{{ couchdb_port }}"
            timeout: 60

      when: "container_engine == 'apptainer'"
      vars:
        - definition_file: "couchdb_container.def"
        - image_file: "couchdb_container.sif"
        - container_name: "couchdb_cont"

    - name: Start couchdb inside a lxc container
      debug:
        msg: 'Couchdb inside a lxc container not yet supported'
      when: "container_engine == 'lxc'"

  when: "not virtual_mode"
  become: no
