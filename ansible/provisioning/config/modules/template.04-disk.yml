# Disk
disk_capabilities: no # "yes" to allow disk capabilities, such as Logical Volumes creation
disk_scaling: no # "yes" to allow disk bandwidth scaling (only relevant when using disk capabilities)

## Benchmarks
prompt_disk_benchmark: "{{ virtual_mode }}" # "yes" to prompt for confirmation before actually running a benchmark on the hosts' disks

# Cache
manage_cache_hosts: no # "yes" to deploy containers with root access that allow to drop the cache on each host