## Services Config
# Every service listens on the port set here; 'opentsdb_port' only applies to the local OpenTSDB if 'deploy_local_opentsdb' is enabled
orchestrator_url: "{{ server_ip }}"
orchestrator_port: 5000
wattwizard_url: "{{ server_ip }}"
wattwizard_port: 7777
couchdb_url: "{{ server_ip }}"
couchdb_port: 5984
opentsdb_url: "{{ server_ip }}"
opentsdb_port: 4242
mongodb_url: "{{ server_ip }}"
mongodb_port: 27017

# Node scaler (ServerlessContainers): deployed on every host node (including the server if 'server_as_host' is enabled)
node_scaler_port: 8000
# Eve server (BDWatchdog timestamping REST API): deployed on the server node
# Must differ from 'node_scaler_port' when 'server_as_host' is enabled, as both would run on the server
eve_server_port: 8010

## Data server
# Local data server to provide files to containers on demand
# Access data server from within containers using DATA_SERVER_IP and DATA_SERVER_PORT environment variables
# Add new sources before deployment at templates/services/data_server/sources.list following format: <filename> <url>
local_data_server: no # "yes" to deploy the local data server
data_server_url: "{{ server_ip }}"
data_server_port: 9001

## OpenTSDB
# 'yes': installs and deploys OpenTSDB on the server node
# 'no': rely on an external OpenTSDB instance; 'opentsdb_url' should be configured appropriately
deploy_local_opentsdb: yes

## Rebooter
# The rebooter service monitors running services and restarts them if they are down
enable_rebooter: yes

## Celery
# Development only: automatically restart the Celery worker when Python code of the web interface (or its utilities) changes, as Django's runserver does
# Running tasks are given 60 seconds to finish before the worker is forcibly restarted
celery_autoreload: no
