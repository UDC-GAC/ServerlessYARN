## Server (Master node)
server_ip: 192.168.56.200
cpus_server_node: 2
memory_server_node: 4096
web_interface_port: 9000
server_as_host: no # 'yes' will use/deploy number_of_hosts-1 additional hosts since the server itself will be a host (worker)

## SMT (Simultaneous Multithreading, e.g., Hyper-Threading) config
# Mode in which the platform deals with the logical cores provided by SMT (SMT is not actually enabled or disabled on the hosts):
#  - disabled: use only the physical cores, ignoring their SMT siblings
#  - enabled: use all the logical cores, both for the platform and the apps
#  - hybrid: the platform uses all the logical cores, but apps may size their own parameters to the physical cores
#            (e.g., Hadoop/Spark vcores). Useful for experimentation, for instance with Hadoop-based apps, whose
#            JVM background threads (GC, JIT, shuffle...) may take advantage of the SMT siblings
# If the hosts have no SMT, all available cores are used regardless of the mode
# The mode actually applied is written to 'effective_smt_mode' (see below)
# Currently, only the number of cores is adjusted; i.e., it won't check whether each core used is physical or logical
smt_mode: disabled

## SLURM specific config
# How much of the total allocated memory is actually used (it is recommended to leave some for SLURM processes themselves)
memory_factor: 0.9

## Hosts (Worker nodes)
number_of_hosts: 2 # 1
cpus_per_host: 4
memory_per_host: 4096
energy_per_host: 200
# Disk config (only relevant if disk_capabilities is set to "yes")
hdd_disks_per_host: 1
hdd_disks_path_list: $HOME/hdd
ssd_disks_per_host: 1
ssd_disks_path_list: $HOME/ssd
create_lvm: no # "yes" to create a LVM using the previous disks. Such disks should be indicated using their /dev path
lvm_path: $HOME/lvm

### Hostnames
## List of hostnames for the hosts to be used within the Ansible inventory
## Do not manually change this list, Vagrant or SLURM will override its value
## The server hostname is also included in this list, being the first item
hostnames: dummy_value

### Effective SMT mode
## SMT mode actually applied by the platform, based on 'smt_mode' and the SMT availability on the hosts
## (i.e., it is always 'disabled' if the hosts have no SMT)
## Do not manually change this value, Vagrant or SLURM will override it (Vagrant always disables it)
effective_smt_mode: disabled
