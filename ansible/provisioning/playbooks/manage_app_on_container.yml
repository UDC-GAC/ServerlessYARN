# Start an app on a container
- hosts: nodes
  become: no
  any_errors_fatal: yes
  gather_facts: yes
  gather_subset: ## prevent gathering all facts
    - "mounts"
  collections:
    - es_udc_gac.smart_sharedfs
  module_defaults:
    synchronize: "{{ global_module_defaults.synchronize }}"
    es_udc_gac.smart_sharedfs.synchronize: "{{ global_module_defaults.synchronize }}"

  vars_files:
    - paths.yml
    - "{{ main_vars }}"
    - "{{ bigdata_vars }}"
    - "{{ defaults }}"
    - "{{ main_config }}"

  vars:
    - jid_file: "{{ ansible_async_dir }}/{{ container }}.jid"
    - singularity_env_file: "/.singularity.d/env/90-environment.sh"
    - container_bind_dir: "{{ [bind_dir, container] | join('/') if container is defined }}"
    - app_tmpdir: "{{ tmpdir }}/{{ app_name }}"

  environment:
    BDWATCHDOG_PATH: "{{ bdwatchdog_path }}"
    RESCALING_PATH: "{{ serverless_containers_path }}/scripts/"
    PYTHONPATH: ":{{ serverless_containers_path }}"

  ## Singularity + cgroups v1

  tasks:
  - import_tasks: "{{ util_tasks }}/get_user_ids.yml"
    tags: always

  ##############################################################################
  ## Generic apps
  ##############################################################################

  ## Setup network
  ## TODO: fix iptables
  - name: Setup network on containers
    block:
      - name: Get containers IP addresses
        shell: "{% for item in containers_info %}
          {% if item.host == inventory_hostname %}
          sudo {{ singularity_command_alias }} exec instance://{{ item.container_name }} su - {{ user_info.user_name }} -c \ 
            {% if not 'expose_ptp' in item %}\"printf '%s ' \\$(hostname -I | awk '{print \\$1}') && hostname\" &&
            {% else %}\"printf '%s ' \\$(hostname -I | awk '{print \\$2}') && hostname\" &&
            {% endif %}
          {% endif  %}
          {% endfor %}true"
        args:
          executable: /bin/bash
        register: ip_addresses

      - name: Update hostname resolution in DNS
        delegate_to: localhost
        run_once: true
        copy:
          content: "{{ resolution_list }}"
          dest: "{{ dns_path }}/{{ app_name }}"
        vars:
          iface_ip_list: "{{ ansible_play_hosts | map('extract', hostvars, 'ip_addresses') | list }}"
          resolution_list: "{% for result in iface_ip_list | flatten(levels=1) %}{{ result.stdout }}\n{% endfor %}"

      # Iptables setup ready, but i'll leave it commented because it interferes with hadoop/yarn
      # - name: Setup Iptables (1)
      #   when: item.host == inventory_hostname
      #   shell: "sudo {{ singularity_command_alias }} exec instance://{{ item.container_name }} bash -c \
      #     'iptables-nft -P FORWARD DROP \
      #     && iptables-nft -P INPUT DROP \
      #     && iptables-nft -A INPUT -m state --state INVALID -j DROP \
      #     && iptables-nft -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT \
      #     && iptables-nft -A INPUT -i lo -j ACCEPT'"
      #   args:
      #     executable: /bin/bash
      #   loop: "{{ containers_info }}"

      # - name: Setup Iptables (2)
      #   when: item[0].host == inventory_hostname
      #   shell: "sudo {{ singularity_command_alias }} exec instance://{{ item[0].container_name }} bash -c \
      #     'iptables-nft -A INPUT -s {{ item[1].stdout | trim }} -j ACCEPT'"
      #   args:
      #     executable: /bin/bash
      #   vars:
      #     iface_ip_list: "{{ ansible_play_hosts | map('extract', hostvars, 'ip_addresses') | map(attribute='results') }}"
      #   loop: "{{ containers_info | product(iface_ip_list | flatten(levels=1) | reject('search','skip_reason'))|list }}"

    vars:
      - containers_info: "{{ containers_info_str | replace('\n','') | replace(' ','') }}"
    tags: never, setup_network

  ## Copy app files
  - name: Copy app files to container
    block:
      - name: Copy app files already on container if there was an installation
        when: "install_script != ''"
        shell: "sudo {{ singularity_command_alias }} exec instance://{{ container }} su - {{ user_info.user_name }} -c 'cp -pr /opt/{{ app_dir | basename }}/* {{ bind_dir_on_container }}'"
        args:
          executable: /bin/bash
        failed_when: false

      - name: Create temporary directory to store templated config files
        delegate_to: localhost
        run_once: yes
        file:
          path: "{{ app_tmpdir }}/{{ container }}"
          state: directory
          owner: "{{ user_info.user_name }}"

      - block:
          - name: Copy runtime files subdirectory in temporary directory
            copy: ## synchronize module would be faster, but it ignores the 'delegate_to' directive
              src: "{{ apps_dir }}/{{ app_dir }}/{{ runtime_files }}"
              dest: "{{ app_tmpdir }}/{{ container }}/"

          - name: Get valid runtime files for templating
            find:
              paths: "{{ apps_dir }}/{{ app_dir }}/{{ runtime_files }}/"
              recurse: yes
              file_type: file
              excludes: "*.jar,*.zip,*.tar,*.rar,*.gz,*.bz2,*.xz,*.7z,*.tgz"
            register: files_to_template

          - name: Template runtime files and store in temporary directory
            template:
              src: "{{ file.path }}"
              dest: "{{ app_tmpdir }}/{{ container }}/{{ runtime_files | basename }}/{{ file.path | relpath(apps_dir + '/' + app_dir + '/' + runtime_files + '/') }}"
            loop: "{{ files_to_template.files }}"
            loop_control:
              loop_var: file
              label: "{{ file.path }}"

        ## When stopping, runtime files are only needed if there is a stop script to run
        when: "runtime_files != '' and ('start_app' in ansible_run_tags or stop_script | default('') != '')"
        delegate_to: localhost
        run_once: yes

      - name: Create output directory in container
        when: output_dir is defined and output_dir != ""
        file:
          path: "{{ container_bind_dir }}/{{ output_dir | basename }}"
          state: directory

    tags: never, start_app, stop_app

  ## Start
  - name: Start app on container
    block:
      - name: Template app start script
        delegate_to: localhost
        template:
          src: "{{ apps_dir }}/{{ app_dir }}/{{ start_script }}"
          dest: "{{ app_tmpdir }}/{{ container }}/"
          mode: preserve

      - name: Copy start script wrapper
        when: enable_app_callback
        delegate_to: localhost
        template:
          src: "{{ templates_dir }}/start_wrapper.sh"
          dest: "{{ app_tmpdir }}/{{ container }}/"
          mode: preserve

      - name: Copy templated config files to remote container
        synchronize:
          src: "{{ app_tmpdir }}/{{ container }}/"
          dest: "{{ container_bind_dir }}/"

      - name: Execute start script on container
        shell: "sudo {{ singularity_command_alias }} exec instance://{{ container }} su - {{ user_info.user_name }} -c 'source {{ singularity_env_file }} && nohup bash {{ bind_dir_on_container }}/{{ script_to_run }} </dev/null'"
        args:
          executable: /bin/bash
        vars:
          script_to_run: "{{ 'start_wrapper.sh' if enable_app_callback else start_script|basename }}"
        async: 20800
        poll: 0
        register: start_job

      - name: Save job id to check status later
        when: not enable_app_callback
        delegate_to: localhost
        copy:
          content: "{{ start_job.ansible_job_id }}"
          dest: "{{ jid_file }}"
          owner: "{{ user_info.user_name }}"

    tags: never, start_app

  ## Wait
  - name: Wait for app container
    block:
      - name: Read start script job id
        set_fact:
          start_job_id: "{{ lookup('file', jid_file) | trim }}"

      # Phase 1: Quick polling for fast-completing jobs (better for developing/debugging)
      - name: Wait until start script has finished - Quick poll for job completion
        async_status:
          jid: "{{ start_job_id }}"
        register: start_status
        until: start_status.finished
        retries: 120
        delay: 0.5
        failed_when: >
          (start_status.finished | default(false)) and
          (
            (start_status.ansible_job_result.rc is defined and start_status.ansible_job_result.rc != 0)
            or
            (start_status.rc is defined and start_status.rc != 0)
            or
            (start_status.failed | default(false))
          )

      # Phase 2: Slower polling if job is still running
      - name: Wait until start script has finished - Continue polling with longer intervals
        when: start_status.finished is not defined or not start_status.finished
        async_status:
          jid: "{{ start_job_id }}"
        register: start_status
        until: start_status.finished
        retries: 360  # 360 * 20 = 7200 seconds (120min - 2h)
        delay: 20

    tags: never, wait_app

  ## Stop
  - name: Stop app on container
    block:
      # Run stop script if defined
      - block:
        - name: Template app stop script
          delegate_to: localhost
          template:
            src: "{{ apps_dir }}/{{ app_dir }}/{{ stop_script }}"
            dest: "{{ app_tmpdir }}/{{ container }}/"
            mode: preserve

        - name: Copy templated config files to remote container
          synchronize:
            src: "{{ app_tmpdir }}/{{ container }}/"
            dest: "{{ container_bind_dir }}/"

        - name: Execute stop script on container
          shell: "sudo {{ singularity_command_alias }} exec instance://{{ container }} su - {{ user_info.user_name }} -c 'source {{ singularity_env_file }} && nohup bash {{ bind_dir_on_container }}/{{ stop_script | basename }} </dev/null'"
          args:
            executable: /bin/bash
          async: 3600
          poll: 0
          register: stop_job

        - name: Wait until stop script has finished
          async_status:
            jid: "{{ stop_job.ansible_job_id }}"
          register: stop_status
          until: stop_status.finished
          retries: 1200
          delay: 0.5

        when: stop_script is defined and stop_script != ""

      - name: Clean container config files from temporary directory
        delegate_to: localhost
        run_once: yes
        file:
          path: "{{ app_tmpdir }}/{{ container }}/"
          state: absent

      # Stop java snitcher
      - name: Stop java snitcher
        shell: "sudo {{ singularity_command_alias }} exec instance://{{ container }} su - {{ user_info.user_name }} -c \
          'tmux kill-session -t JAVA_SNITCH'"
        args:
          executable: /bin/bash
        failed_when: false

      # Manage output data
      - block:
        - name: Set output data timestamp
          when: timestamp is not defined # --> only set current timestamp if another timestamp has not been set
          set_fact:
            timestamp: "{{ now(fmt='%Y-%m-%d--%H-%M-%S') }}"

        - name: Move Hadoop logs to output_dir (Big Data apps)
          import_tasks: "{{ bigdata_tasks }}/collect_hadoop_logs.yml"

        - block:
          - name: Create output directory on server
            delegate_to: localhost
            file:
              path: "{{ stored_output_dir }}"
              state: directory

          - name: Fetch output data from container to server
            synchronize:
              src: "{{ container_bind_dir }}/{{ output_dir }}/"
              dest: "{{ stored_output_dir }}"
              mode: pull

          - name: Add info about download and upload time
            delegate_to: localhost
            when: download_time > 0 or upload_time > 0
            copy:
              dest: "{{ stored_output_dir }}/transfer_times_{{ timestamp }}.txt"
              content: |
                "Download time (global-->local) = {{ download_time }}"
                "Upload time (local-->global) = {{ upload_time }}"

          ## Once persisted, output data is removed from the container bind directory
          ## Required for containers whose bind directory is kept after stopping them (e.g., global HDFS NameNode), so data is not stored again in later runs
          - name: Remove persisted output data from container
            file:
              path: "{{ container_bind_dir }}/{{ output_dir }}"
              state: absent

          vars:
            stored_output_dir: "{{ app_output_data }}/{{ app_name }}/{{ timestamp }}/{{ output_dir }}-{{ container }}"

        when: "output_dir is defined and output_dir != ''"

    tags: never, stop_app

  ## Remove the DNS entries of an app
  ## Run just once after all the app containers have been stopped (removing the whole file is enough, since per-app files are used)
  - name: Remove DNS entries for app
    delegate_to: localhost
    run_once: yes
    file:
      path: "{{ dns_path }}/{{ app_name }}"
      state: absent
    tags: never, remove_dns_entries

  ##############################################################################
  ## Big Data (Hadoop / Spark / HDFS)
  ## Order matters when several tags are run together, e.g.,
  ##   setup_network -> start_zookeeper -> setup_hadoop -> copy_files
  ##############################################################################

  ## Tags: start_zookeeper
  - import_tasks: "{{ bigdata_tasks }}/zookeeper_start.yml"

  ## Tags: setup_hadoop, setup_hdfs
  - import_tasks: "{{ bigdata_tasks }}/hadoop_cluster_setup.yml"

  ## Tags: copy_files, download_to_local, upload_to_global
  - import_tasks: "{{ bigdata_tasks }}/hdfs_data_transfer.yml"

  ## Tags: stop_hadoop_cluster
  - import_tasks: "{{ bigdata_tasks }}/hadoop_cluster_stop.yml"

  ## Tags: create_dir_on_hdfs, remove_file_from_hdfs, add_file_to_hdfs, get_file_from_hdfs,
  ##       set_hdfs_replication, get_hdfs_filesystem
  - import_tasks: "{{ bigdata_tasks }}/hdfs_file_ops.yml"

  ## Tags: get_hdfs_block_locations
  - import_tasks: "{{ bigdata_tasks }}/hdfs_data_locality.yml"
