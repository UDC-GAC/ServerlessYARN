platform_management:
  hosts:
    platform_server:
      host_ip: 192.168.56.200
      ansible_host: server
nodes:
  hosts:
    host0:
      disks:
        ssd_0:
            path: /home/vagrant/ssd
        hdd_0:
            path: /home/vagrant/hdd
        lvm:
            path: /home/vagrant/lvm
      containers:
          - host0-cont0
          - host0-cont1
  ## Default variables for group
  vars:
    cpu: 4
    mem: 4096
    energy: 200
    disks: {}
    containers: []